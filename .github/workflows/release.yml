name: Release

on:
  push:
    tags:
      - 'v*'  # Triggered when a tag like v1.0.0 is pushed
  workflow_dispatch:  # Allow manual trigger
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
      build_number:
        description: 'Build number (e.g., 1)'
        required: true

env:
  APP_NAME: DailyBriefing
  MACOS_VERSION: '14.0'

jobs:
  build-and-release:
    runs-on: macos-14
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for git operations

      - name: Setup Swift
        uses: swift-actions/setup-swift@v1
        with:
          swift-version: '5.9'

      - name: Extract version from tag or input
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            BUILD_NUMBER="${{ github.event.inputs.build_number }}"
          else
            # Extract version from tag (e.g., v1.0.0 -> 1.0.0)
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG_NAME#v}"
            # Calculate build number from version to ensure it always increases
            # Convert version like "0.3.0" to build number like 300 (0*10000 + 3*100 + 0)
            # This ensures 0.3.0 (300) > 0.2.6 (206) > 0.2.5 (205)
            IFS='.' read -ra VERSION_PARTS <<< "$VERSION"
            MAJOR="${VERSION_PARTS[0]:-0}"
            MINOR="${VERSION_PARTS[1]:-0}"
            PATCH="${VERSION_PARTS[2]:-0}"
            # Calculate: major*10000 + minor*100 + patch
            BUILD_NUMBER=$((MAJOR * 10000 + MINOR * 100 + PATCH))
            if [[ ! "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || [[ "$BUILD_NUMBER" -lt 1 ]]; then
              BUILD_NUMBER="1"
            fi
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build_number=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}, Build: ${BUILD_NUMBER}"

      - name: Build app
        run: |
          cd DailyBriefing
          swift build -c release

      - name: Package app bundle
        run: |
          VERSION="${{ steps.version.outputs.version }}" \
          BUILD_NUMBER="${{ steps.version.outputs.build_number }}" \
          SPARKLE_PUBLIC_ED_KEY="${{ secrets.SPARKLE_PUBLIC_ED_KEY }}" \
          ./scripts/package-release.sh

      - name: Create DMG
        run: |
          VERSION="${{ steps.version.outputs.version }}" \
          BUILD_NUMBER="${{ steps.version.outputs.build_number }}" \
          ./scripts/package-dmg.sh

      - name: Sign DMG with Sparkle
        id: sign_dmg
        run: |
          DMG_PATH="dist/${APP_NAME}-${{ steps.version.outputs.version }}.dmg"
          
          if [[ -z "${{ secrets.SPARKLE_PRIVATE_ED_KEY }}" ]]; then
            echo "Warning: SPARKLE_PRIVATE_ED_KEY secret not set. DMG will not be signed."
            echo "signature=" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Find or download Sparkle sign_update tool
          SIGN_TOOL=""
          SIGN_TOOL_DIR=""
          
          # Check if sign_update exists in Sparkle artifacts
          if [[ -f "DailyBriefing/.build/artifacts/sparkle/Sparkle/bin/sign_update" ]]; then
            SIGN_TOOL_DIR="DailyBriefing/.build/artifacts/sparkle/Sparkle/bin"
            SIGN_TOOL="${SIGN_TOOL_DIR}/sign_update"
          elif command -v sign_update &> /dev/null; then
            SIGN_TOOL="sign_update"
          else
            # Download Sparkle release to get sign_update tool
            echo "Downloading Sparkle tools..."
            SPARKLE_VERSION="2.8.1"
            SPARKLE_URL="https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
            SIGN_TOOL_DIR="$(mktemp -d)"
            
            curl -L -o "${SIGN_TOOL_DIR}/sparkle.tar.xz" "${SPARKLE_URL}"
            tar -xf "${SIGN_TOOL_DIR}/sparkle.tar.xz" -C "${SIGN_TOOL_DIR}" --strip-components=1
            
            if [[ -f "${SIGN_TOOL_DIR}/bin/sign_update" ]]; then
              SIGN_TOOL="${SIGN_TOOL_DIR}/bin/sign_update"
              chmod +x "${SIGN_TOOL}"
            else
              echo "Error: Could not find sign_update tool after download" >&2
              exit 1
            fi
          fi
          
          if [[ ! -f "${SIGN_TOOL}" ]] && ! command -v "${SIGN_TOOL}" &> /dev/null; then
            echo "Error: sign_update tool not found at ${SIGN_TOOL}" >&2
            exit 1
          fi
          
          # Create temporary key file
          KEY_FILE=$(mktemp)
          echo "${{ secrets.SPARKLE_PRIVATE_ED_KEY }}" > "$KEY_FILE"
          
          # Sign the DMG - sign_update outputs: sparkle:edSignature="..." length="..."
          SIGN_OUTPUT=$("${SIGN_TOOL}" "$DMG_PATH" --ed-key-file "$KEY_FILE" 2>&1)
          SIGN_EXIT_CODE=$?
          
          # Clean up key file immediately
          rm -f "$KEY_FILE"
          
          if [[ $SIGN_EXIT_CODE -ne 0 ]]; then
            echo "Error: sign_update failed with exit code $SIGN_EXIT_CODE" >&2
            echo "Output: $SIGN_OUTPUT" >&2
            exit 1
          fi
          
          # Extract signature from output (format: sparkle:edSignature="..." length="...")
          # sign_update may output on one line or multiple lines
          SIGNATURE=$(echo "$SIGN_OUTPUT" | grep -o 'sparkle:edSignature="[^"]*"' | sed 's/sparkle:edSignature="\([^"]*\)"/\1/' | head -n 1)
          
          if [[ -z "$SIGNATURE" ]]; then
            echo "Error: Failed to extract signature from sign_update output" >&2
            echo "Output: $SIGN_OUTPUT" >&2
            exit 1
          fi
          
          echo "signature=${SIGNATURE}" >> $GITHUB_OUTPUT
          echo "✓ DMG signed successfully"
          
          # Clean up downloaded Sparkle tools if we downloaded them
          if [[ -n "${SIGN_TOOL_DIR}" && "${SIGN_TOOL_DIR}" == /tmp/* ]]; then
            rm -rf "${SIGN_TOOL_DIR}"
          fi

      - name: Generate appcast.xml
        id: appcast
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD_NUMBER="${{ steps.version.outputs.build_number }}"
          DMG_PATH="dist/${APP_NAME}-${VERSION}.dmg"
          ZIP_PATH="dist/${APP_NAME}-${VERSION}.zip"
          
          # Get file sizes
          DMG_SIZE=$(stat -f%z "${DMG_PATH}")
          ZIP_SIZE=$(stat -f%z "${ZIP_PATH}")
          
          # Get current date in RSS format
          PUB_DATE=$(date -u +"%a, %d %b %Y %H:%M:%S +0000")
          
          # Generate download URLs (will be updated after release)
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}"
          DMG_URL="${RELEASE_URL}/${APP_NAME}-${VERSION}.dmg"
          ZIP_URL="${RELEASE_URL}/${APP_NAME}-${VERSION}.zip"
          
          # Get signature from previous step (or empty if not signed)
          SIGNATURE="${{ steps.sign_dmg.outputs.signature }}"
          
          # Build enclosure tag with optional signature
          ENCLOSURE_TAG="<enclosure"
          ENCLOSURE_TAG="${ENCLOSURE_TAG} url=\"${DMG_URL}\""
          ENCLOSURE_TAG="${ENCLOSURE_TAG} length=\"${DMG_SIZE}\""
          ENCLOSURE_TAG="${ENCLOSURE_TAG} type=\"application/octet-stream\""
          if [[ -n "${SIGNATURE}" ]]; then
            ENCLOSURE_TAG="${ENCLOSURE_TAG} sparkle:edSignature=\"${SIGNATURE}\""
          fi
          ENCLOSURE_TAG="${ENCLOSURE_TAG} />"
          
          # Create new item XML
          NEW_ITEM=$(cat <<ITEM
            <item>
              <title>Version ${VERSION}</title>
              <link>https://github.com/${{ github.repository }}</link>
              <sparkle:version>${BUILD_NUMBER}</sparkle:version>
              <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
              <sparkle:minimumSystemVersion>${MACOS_VERSION}</sparkle:minimumSystemVersion>
              <pubDate>${PUB_DATE}</pubDate>
              <description><![CDATA[
                <h2>Version ${VERSION}</h2>
                <p>Neue Version von ${APP_NAME}</p>
              ]]></description>
              ${ENCLOSURE_TAG}
            </item>
          ITEM
          )
          
          # Try to fetch existing appcast.xml from gh-pages
          # First try root location, then fall back to old locations for migration
          EXISTING_ITEMS=""
          if git fetch origin gh-pages:gh-pages 2>/dev/null; then
            if git show gh-pages:appcast.xml > dist/existing-appcast.xml 2>/dev/null; then
              # Extract existing items from root location
              EXISTING_ITEMS=$(sed -n '/<channel>/,/<\/channel>/p' dist/existing-appcast.xml | sed '1d;$d' | grep -v '^[[:space:]]*</channel>' || true)
            elif git show gh-pages:DailyBriefing/appcast.xml > dist/existing-appcast.xml 2>/dev/null; then
              # Migrate from DailyBriefing directory
              EXISTING_ITEMS=$(sed -n '/<channel>/,/<\/channel>/p' dist/existing-appcast.xml | sed '1d;$d' | grep -v '^[[:space:]]*</channel>' || true)
            elif git show gh-pages:DailyDigest/appcast.xml > dist/existing-appcast.xml 2>/dev/null; then
              # Migrate from DailyDigest directory
              EXISTING_ITEMS=$(sed -n '/<channel>/,/<\/channel>/p' dist/existing-appcast.xml | sed '1d;$d' | grep -v '^[[:space:]]*</channel>' || true)
            fi
          fi
          
          # Create appcast.xml with new item first, then existing items
          mkdir -p dist
          cat > dist/appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0"
               xmlns:sparkle="https://sparkle-project.org/xml-namespaces/sparkle"
               xmlns:dc="http://purl.org/dc/elements/1.1/">
            <channel>
              <title>${APP_NAME} Updates</title>
              <link>https://juliusfrick.github.io/DailyBriefing/appcast.xml</link>
              <description>Latest versions of ${APP_NAME}</description>
              <language>de</language>
              
          ${NEW_ITEM}
          ${EXISTING_ITEMS}
            </channel>
          </rss>
          EOF
          
          echo "appcast_path=dist/appcast.xml" >> $GITHUB_OUTPUT
          echo "dmg_size=${DMG_SIZE}" >> $GITHUB_OUTPUT
          echo "dmg_url=${DMG_URL}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/${{ env.APP_NAME }}-${{ steps.version.outputs.version }}.dmg
            dist/${{ env.APP_NAME }}-${{ steps.version.outputs.version }}.zip
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: |
            ## Version ${{ steps.version.outputs.version }}
            
            ### Downloads
            - [DMG Installer](https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/${{ env.APP_NAME }}-${{ steps.version.outputs.version }}.dmg)
            - [ZIP Archive](https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/${{ env.APP_NAME }}-${{ steps.version.outputs.version }}.zip)
            
            ### Installation
            1. Download the DMG file
            2. Open the DMG and drag DailyBriefing.app to Applications
            3. Launch DailyBriefing from Applications
          draft: false
          prerelease: false

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Update appcast.xml on GitHub Pages
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Fetch all branches including gh-pages
          git fetch origin
          
          # Try to checkout gh-pages branch, create if it doesn't exist
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout -b gh-pages origin/gh-pages || git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . || true
          fi
          
          # Copy the new appcast.xml (generated in previous step)
          cp dist/appcast.xml appcast.xml
          
          # Keep legacy locations for backward compatibility
          mkdir -p DailyBriefing DailyDigest
          cp dist/appcast.xml DailyBriefing/appcast.xml
          cp dist/appcast.xml DailyDigest/appcast.xml
          
          # Commit and push
          git add appcast.xml DailyBriefing/appcast.xml DailyDigest/appcast.xml
          if git diff --staged --quiet && git diff --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update appcast.xml for version ${{ steps.version.outputs.version }} (migrate to root)" || git commit -m "Update appcast.xml for version ${{ steps.version.outputs.version }}"
            git push origin gh-pages
          fi

      - name: Upload appcast.xml artifact
        uses: actions/upload-artifact@v4
        with:
          name: appcast.xml
          path: dist/appcast.xml
          retention-days: 30
